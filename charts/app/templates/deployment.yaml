apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "app.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0 # never drop below the desired count during a rollout
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "app.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "app.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "app.name" . }}
      automountServiceAccountToken: false # belt and braces with the ServiceAccount setting
      enableServiceLinks: false           # don't inject every Service in the namespace as env vars
      terminationGracePeriodSeconds: 45   # > preStop sleep + Spring graceful shutdown

      # Pod-level: non-root with a fixed high UID/GID, and the runtime's default seccomp syscall filter.
      securityContext:
        runAsNonRoot: true
        runAsUser: {{ .Values.podSecurity.uid }}
        runAsGroup: {{ .Values.podSecurity.gid }}
        fsGroup: {{ .Values.podSecurity.gid }}
        seccompProfile:
          type: RuntimeDefault

      # Spread the two replicas over both Spot nodes so one interruption leaves one replica serving.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "app.selectorLabels" . | nindent 14 }}

      containers:
        - name: app
          # Digest only (no tag), and the schema rejects anything that isn't sha256:<64 hex>.
          image: "{{ .Values.image.repository }}@{{ required "image.digest is required: release.yml sets it after a scanned build" .Values.image.digest }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          # Container-level hardening (what PSS "restricted" requires, plus a read-only root filesystem).
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: {{ .Values.podSecurity.uid }}
            runAsGroup: {{ .Values.podSecurity.gid }}
            privileged: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault

          {{- with .Values.env }}
          # Plain, non-secret settings only (the values schema rejects secret-looking names).
          env:
            {{- range $name, $value := . }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
          {{- end }}

          resources:
            {{- toYaml .Values.resources | nindent 12 }}

          # Startup probe gives the JVM up to 150 s on a busy small Spot node before liveness takes over.
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
            failureThreshold: 3

          lifecycle:
            # Keep serving for 10 s after the pod is marked terminating, so the ALB finishes deregistering
            # the target before Spring stops accepting requests. Native sleep: distroless has no shell.
            preStop:
              sleep:
                seconds: 10

          volumeMounts:
            # The only writable path (Tomcat work dirs, JVM temp files). Memory-backed and size-capped.
            - name: tmp
              mountPath: /tmp
            # Secrets as files, not env vars. Spring's configtree import (application.properties) reads
            # /etc/spr/config/GREETING_PREFIX as the GREETING_PREFIX property.
            - name: app-config
              mountPath: /etc/spr/config
              readOnly: true
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
        # The Kubernetes Secret written by External Secrets from AWS Secrets Manager (spr/demo).
        - name: app-config
          secret:
            secretName: {{ include "app.secretName" . }}
            defaultMode: 0440 # owner+group read only; readable via fsGroup 65532, never writable
