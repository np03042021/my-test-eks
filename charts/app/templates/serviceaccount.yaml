# Dedicated identity with no API token mounted: the app never talks to the Kubernetes API,
# and it needs no AWS permissions (External Secrets fetches the secret on its behalf).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "app.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
automountServiceAccountToken: false
