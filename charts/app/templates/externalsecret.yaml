# External Secrets Operator reads spr/demo from AWS Secrets Manager (using its own Pod Identity role,
# which can read only that secret) and writes a Kubernetes Secret the Deployment consumes.
# The secret value is never in Git, in Helm values, or in the image.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "app.name" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.externalSecret.storeName }}
  target:
    name: {{ include "app.secretName" . }}
    creationPolicy: Owner # the Secret is deleted with the ExternalSecret; nothing is left behind
  # Explicit key list, not dataFrom/extract: only the named JSON keys are synced, so a key added to
  # spr/demo later doesn't silently appear in the cluster.
  data:
    {{- range .Values.externalSecret.keys }}
    - secretKey: {{ . }}
      remoteRef:
        key: {{ $.Values.externalSecret.remoteKey }}
        property: {{ . }}
    {{- end }}
