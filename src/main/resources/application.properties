spring.application.name=secure-paved-road-app
server.port=8080

# In the cluster, the Kubernetes Secret synced by External Secrets (spr/demo) is mounted as read-only files,
# one per key, at /etc/spr/config/ (secrets as files, not env vars: env leaks via /proc/<pid>/environ, child
# processes and crash dumps). configtree turns each file into a property, e.g. GREETING_PREFIX.
# "optional:" so local runs without the mount still start; an env var of the same name also works locally.
spring.config.import=optional:configtree:/etc/spr/config/

# The default is for local runs only; it is not a secret.
app.greeting.prefix=${GREETING_PREFIX:Hello}

# Never leak internals in error responses.
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.error.include-exception=false

# Finish in-flight requests when Kubernetes sends SIGTERM (rolling updates, Spot interruptions).
server.shutdown=graceful

# Actuator: deny by default, then allow only health. Every other endpoint (env, heapdump, beans,
# configprops, loggers, ...) is not just hidden but disabled, so it can't be exposed by accident later.
management.endpoints.access.default=none
management.endpoint.health.access=read-only
management.endpoints.web.exposure.include=health
management.endpoints.jmx.exposure.exclude=*
# Liveness and readiness groups (/actuator/health/liveness, /actuator/health/readiness) for Kubernetes probes.
# Boot enables them automatically on Kubernetes; set explicitly so they work locally and in tests too.
management.endpoint.health.probes.enabled=true
# Status only: no component details (DB, disk space, hostnames) to unauthenticated callers.
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
