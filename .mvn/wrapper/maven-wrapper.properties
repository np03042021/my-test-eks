# Maven Wrapper 3.3.4 (scripts verified identical to org.apache.maven.wrapper:maven-wrapper-distribution:3.3.4).
# only-script: no maven-wrapper.jar binary in the repo, just the shell/cmd scripts.
wrapperVersion=3.3.4
distributionType=only-script
# Needs `unzip` on the machine (macOS and GitHub's ubuntu runners have it). Without unzip, mvnw silently
# switches to the .tar.gz, whose checksum differs, and fails closed. The Docker build stage uses the official
# maven:3.10.0 image instead (same Maven version, pinned by digest).
distributionUrl=https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.10.0/apache-maven-3.10.0-bin.zip
# The wrapper refuses to use the downloaded Maven if its SHA-256 doesn't match (supply-chain check).
# Cross-checked: sha512 matches both repo.maven.apache.org and downloads.apache.org.
distributionSha256Sum=1f6d9909266510f039f59aa0e13dcd2c66da85f043e56276e41f2918f8bddaff
